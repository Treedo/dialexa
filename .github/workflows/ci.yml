name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen  # headless Qt (QCoreApplication у тестах)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        # libegl1 — для PySide6 на headless runner; звукові бібліотеки не потрібні:
        # soundcard імпортується ліниво і тести його не чіпають
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
